name: Mobile CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci-cd.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci-cd.yml'

jobs:
  test:
    name: Test Mobile App
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.0'
          channel: 'stable'
          cache: true
      
      - name: Install Dependencies
        run: |
          cd mobile
          flutter pub get
      
      - name: Analyze
        run: |
          cd mobile
          flutter analyze
      
      - name: Run Tests
        run: |
          cd mobile
          flutter test --coverage
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./mobile/coverage/lcov.info
          fail_ci_if_error: false
  
  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.0'
          channel: 'stable'
          cache: true
      
      - name: Install Dependencies
        run: |
          cd mobile
          flutter pub get
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
      
      - name: Extract branch name
        shell: bash
        run: echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_ENV
      
      - name: Set environment variables
        run: |
          if [ "${{ env.BRANCH_NAME }}" = "main" ]; then
            echo "API_URL=https://api.indowater.com/api" >> $GITHUB_ENV
            echo "APP_ENV=production" >> $GITHUB_ENV
          else
            echo "API_URL=https://dev-api.indowater.com/api" >> $GITHUB_ENV
            echo "APP_ENV=development" >> $GITHUB_ENV
          fi
      
      - name: Create key.properties
        run: |
          cd mobile/android
          mkdir -p key
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> key.properties
          echo "storeFile=key/indowater.keystore" >> key.properties
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > key/indowater.keystore
      
      - name: Build APK
        run: |
          cd mobile
          flutter build apk --release --flavor ${{ env.APP_ENV }} --dart-define=API_URL=${{ env.API_URL }}
      
      - name: Build App Bundle
        run: |
          cd mobile
          flutter build appbundle --release --flavor ${{ env.APP_ENV }} --dart-define=API_URL=${{ env.API_URL }}
      
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: indowater-${{ env.BRANCH_NAME }}-apk
          path: mobile/build/app/outputs/flutter-apk/app-${{ env.APP_ENV }}-release.apk
      
      - name: Upload App Bundle
        uses: actions/upload-artifact@v3
        with:
          name: indowater-${{ env.BRANCH_NAME }}-aab
          path: mobile/build/app/outputs/bundle/${{ env.APP_ENV }}Release/app-${{ env.APP_ENV }}-release.aab
  
  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.0'
          channel: 'stable'
          cache: true
      
      - name: Install Dependencies
        run: |
          cd mobile
          flutter pub get
      
      - name: Extract branch name
        shell: bash
        run: echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_ENV
      
      - name: Set environment variables
        run: |
          if [ "${{ env.BRANCH_NAME }}" = "main" ]; then
            echo "API_URL=https://api.indowater.com/api" >> $GITHUB_ENV
            echo "APP_ENV=production" >> $GITHUB_ENV
          else
            echo "API_URL=https://dev-api.indowater.com/api" >> $GITHUB_ENV
            echo "APP_ENV=development" >> $GITHUB_ENV
          fi
      
      - name: Setup Provisioning Profile
        run: |
          cd mobile/ios
          mkdir -p Runner/Provisioning
          echo "${{ secrets.PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > Runner/Provisioning/IndoWater.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp Runner/Provisioning/IndoWater.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
      
      - name: Setup Code Signing
        run: |
          cd mobile/ios
          echo "${{ secrets.CERTIFICATE_P12_BASE64 }}" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "${{ secrets.CERTIFICATE_PASSWORD }}" -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
      
      - name: Build iOS App
        run: |
          cd mobile
          flutter build ios --release --flavor ${{ env.APP_ENV }} --dart-define=API_URL=${{ env.API_URL }} --no-codesign
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme ${{ env.APP_ENV }} -configuration Release -archivePath build/Runner.xcarchive archive
          xcodebuild -exportArchive -archivePath build/Runner.xcarchive -exportOptionsPlist exportOptions.plist -exportPath build/Runner.ipa
      
      - name: Upload IPA
        uses: actions/upload-artifact@v3
        with:
          name: indowater-${{ env.BRANCH_NAME }}-ipa
          path: mobile/ios/build/Runner.ipa
  
  deploy-android:
    name: Deploy Android App
    runs-on: ubuntu-latest
    needs: build-android
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Download APK
        uses: actions/download-artifact@v3
        with:
          name: indowater-main-apk
          path: apk
      
      - name: Download App Bundle
        uses: actions/download-artifact@v3
        with:
          name: indowater-main-aab
          path: aab
      
      - name: Setup Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.indowater.app
          releaseFiles: aab/app-production-release.aab
          track: production
          status: completed
          inAppUpdatePriority: 3
  
  deploy-ios:
    name: Deploy iOS App
    runs-on: macos-latest
    needs: build-ios
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Download IPA
        uses: actions/download-artifact@v3
        with:
          name: indowater-main-ipa
          path: ipa
      
      - name: Upload to App Store
        uses: apple-actions/upload-app-store@v1
        with:
          app-path: ipa/Runner.ipa
          apple-id: ${{ secrets.APPLE_ID }}
          password: ${{ secrets.APPLE_PASSWORD }}
          app-specific-password: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          team-id: ${{ secrets.APPLE_TEAM_ID }}
          skip-binary-upload: false
          skip-screenshots: true
          skip-metadata: true